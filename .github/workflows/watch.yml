name: SFJATC watcher
on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: python check.py
        continue-on-error: true
      - run: |
          git config user.name "sfjatc-watcher"
          git config user.email "actions@github.com"
          git add snapshot.txt snapshot.hash || true
          git diff --staged --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
      - if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `SFJATC page changed — ${new Date().toISOString().slice(0,10)}`,
              body: `Page at https://www.sfelectricaltraining.org/ changed. See snapshot.txt in the repo or the run log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
